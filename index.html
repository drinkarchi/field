<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2D4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Archi Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: field staff get a single phone column with a floating navy nav; managers get a navy sidebar + pastel workspace. Light pastel theme only (brand decision). */
:root{
  --bg:#F4F8F3; --surface:#FFFFFF; --ink:#1C2D4F; --muted:#56627A; --line:#E3E8E1; --chip-line:#D3DAE6; --chip-bg:#EEF2F6;
  --navy:#1C2D4F; --on-navy:#FFFFFF; --on-navy-muted:#B8C6E0; --green:#2F5A0C; --leaf:#8FD06B; --leaf-dark:#3F8A2A;
  --mint:#E3F1E4; --mint-fg:#1F4A08; --sky:#E3ECF8; --butter:#FBF1D9; --butter-fg:#5E4200; --rose:#F8E4E1; --rose-fg:#8E2A1E; --rose-line:#E8B4AC;
  --disabled:#D7DDD4; --disabled-fg:#56635A; --ring-track:rgba(255,255,255,0.16); --photo-a:#CFDCC3; --photo-b:#B6C8A6; --wm:rgba(15,22,18,0.74);
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; --body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.02em;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:28px} h2{font-size:19px} h3{font-size:16px}
button{font:inherit;cursor:pointer;color:inherit}
select,input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--leaf-dark);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums} .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tb-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:10px}
.brand{display:flex;align-items:center;gap:7px}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-0.02em}
.brand small{font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--green);margin-top:5px}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--butter);color:var(--butter-fg);padding:5px 9px;border-radius:999px}
select{height:40px;border-radius:12px;border:1px solid var(--chip-line);background:var(--surface);padding:0 10px;max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{border:0}
.hero{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero .lbl{font-size:12px;font-weight:500;color:var(--on-navy-muted);letter-spacing:.05em;text-transform:uppercase}
.hero .big{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-0.02em}
.hero .sub{font-size:12px;color:var(--on-navy-muted)}
.ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:14px;border:1px solid var(--chip-line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-align:left}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-navy)}
.chip.sm{min-height:38px;padding:6px 12px;font-size:13px;border-radius:12px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:12px}
.btn-green{background:var(--green);color:var(--on-navy)} .btn-navy{background:var(--navy);color:var(--on-navy)} .btn-soft{background:var(--sky);color:var(--navy)}
.btn-line{background:var(--surface);border-color:var(--chip-line);color:var(--ink)} .btn-danger{background:var(--surface);border-color:var(--rose-line);color:var(--rose-fg)}
.btn:disabled{background:var(--disabled);border-color:var(--disabled);color:var(--disabled-fg);cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--mint);color:var(--mint-fg)} .warn{background:var(--butter);color:var(--butter-fg)} .bad{background:var(--rose);color:var(--rose-fg)} .info{background:var(--sky);color:var(--navy)} .neu{background:var(--chip-bg);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.d-ok{background:var(--leaf-dark)} .d-warn{background:#C8961C} .d-bad{background:#C0392B} .d-info{background:var(--navy)}

.steprow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:14px;padding:8px 8px 8px 14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;border:0;font-size:20px}
.stepper .minus{background:var(--sky);color:var(--navy)} .stepper .plus{background:var(--navy);color:var(--on-navy)}
.stepper output{min-width:38px;text-align:center;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
input.txt,textarea.txt{border-radius:12px;border:1px solid var(--chip-line);background:var(--surface);width:100%}
input.txt{height:46px;padding:0 14px} textarea.txt{padding:10px 14px;resize:vertical;min-height:72px}
input.numin{height:40px;width:130px;border-radius:10px;border:1px solid var(--chip-line);padding:0 10px;background:var(--surface);font-variant-numeric:tabular-nums}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}

.field{max-width:480px;margin:0 auto;padding-block:18px 120px;display:flex;flex-direction:column;gap:14px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.task.cur{border-color:#9CC77F}
.task b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done b{color:var(--muted);text-decoration:line-through}
.mark{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--chip-line);background:var(--surface)}
.mark.on{background:var(--leaf-dark);border-color:var(--leaf-dark);color:var(--on-navy)}
.bnav{position:fixed;left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--navy);border-radius:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px;box-shadow:0 12px 28px rgba(28,45,79,.28);z-index:15}
.bnav button{height:48px;border-radius:16px;border:0;background:transparent;color:var(--on-navy-muted);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.bnav button.on{background:var(--green);color:var(--on-navy)}
.wfoot{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.segs i{height:6px;border-radius:3px;background:var(--sky)} .segs i.on{background:var(--green)}
.photo{height:190px;border-radius:14px;background:linear-gradient(180deg,var(--photo-a),var(--photo-b));position:relative;overflow:hidden}
.photo .wm{z-index:1;position:absolute;left:0;right:0;bottom:0;background:var(--wm);color:var(--on-navy);font-size:11px;padding:8px 12px;line-height:1.45}
.camera{min-height:120px;border-radius:14px;border:2px dashed #B7C4AE;background:var(--bg);color:var(--green);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
details.comp summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.comp summary::-webkit-details-marker{display:none}

.mgr{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 62px)}
.side{flex:1 1 220px;max-width:100%;background:var(--navy);color:var(--on-navy-muted);padding-block:20px;display:flex;flex-direction:column;gap:16px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{text-align:left;padding:11px 14px;border-radius:14px;border:0;background:transparent;color:var(--on-navy-muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.side nav button.on{background:var(--green);color:var(--on-navy)}
.side .me{margin-top:auto;background:rgba(255,255,255,.07);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.side .me b{color:var(--on-navy);font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--leaf);color:var(--navy);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.main{flex:999 1 640px;min-width:0;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
.side-logo{display:flex;align-items:flex-end;gap:8px;padding:0 6px 4px}.side-logo small{font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--leaf);margin-bottom:7px}
@media (max-width:900px){.side nav{flex-direction:row;flex-wrap:wrap}.side .me{display:none}.mgr{min-height:0}.side-logo{display:none}}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;border:0;text-align:left}
.stat b{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start} .cols>*{flex:1 1 340px;min-width:0}
.tbl{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;white-space:nowrap}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--sky);overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .c{border-radius:12px;padding:6px 6px 8px;min-height:54px;font-size:11px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.cal .c b{font-size:13px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:6px}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.stripe{width:5px;align-self:stretch;border-radius:3px;min-height:40px}
.skubox{width:62px;border-radius:10px;padding:6px 0;text-align:center}
.skubox small{display:block;font-size:10px;font-weight:600} .skubox b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cells div{border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cells small{font-size:10px;color:var(--muted)} .cells b{font-size:13px;overflow-wrap:anywhere}
.ph{width:160px;max-width:100%;height:108px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;background:linear-gradient(180deg,var(--photo-a),var(--photo-b))}
.ph{position:relative;overflow:hidden}.ph .phlink{position:absolute;inset:0;display:block}.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.ph span{position:relative;z-index:1;font-size:11px;font-weight:600;background:var(--surface);padding:3px 8px;border-radius:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:12px 18px;border-radius:14px;z-index:50;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 24px rgba(28,45,79,.25)}
.note{background:var(--butter);color:var(--butter-fg);border-radius:14px;padding:10px 14px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.nbadge{margin-left:auto;background:#C0392B;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;line-height:18px}.linkbtn{border:0;background:none;padding:0;color:var(--navy);font-weight:600;text-decoration:underline;cursor:pointer;font:inherit}</style>
</head>

function statusStyle(s){return {belumrute:['neu','Rute -'],khusus:['info','Tugas'],tercapai:['ok','✓'],sebagian:['warn','½'],tidak:['bad','✗'],izin:['info','Izin'],berjalan:['warn','Hari ini'],libur:['neu','Libur'],nanti:['neu','']}[s]||['neu','']}

  return h+'</div>';
}

  days.forEach(function(d){var route=isMd?routeOf(u.id,d):[];var ts=tasksOf(u.id,d);var open=UI.wkopen===d;
    var sum=isMd?(route.length?route.length+' toko':(bmMode(d)?'Rute belum ditentukan':'Tidak ada kunjungan')):'Tugas rutin di '+outletOf(u.outlet).nama;
    if(ts.length)sum+=' · '+ts.length+' tugas lain';

    if(open){h+='<div class="stack" style="gap:6px;padding:0 0 12px 62px">'+(isMd?route.map(function(oid,i){var o=outletOf(oid);return '<div class="row" style="gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px"><span class="small" style="font-weight:700;color:var(--muted);width:16px">'+(i+1)+'</span><span class="grow"><b style="font-size:13px">'+esc(o.nama)+'</b><span class="small muted">'+esc(o.wilayah||'')+' · '+esc(o.kerjasama)+'</span></span></div>'}).join(''):'')+ts.map(function(t){return '<div class="info" style="border-radius:10px;padding:8px 10px"><b style="font-size:13px">'+esc(t.jenis)+' · '+esc(outletOf(t.outlet).nama)+'</b><div class="small">'+esc(t.catatan)+' · dari '+esc(t.by)+'</div></div>'}).join('')+((isMd&&!route.length&&!ts.length)?'<span class="small muted">Belum ada rencana untuk hari ini.</span>':'')+'</div>'}

  if(ex)h+='<span>'+lvlPill(ex.status==='Disetujui'?'ok':(ex.status==='Ditolak'?'bad':'warn'),'Pengecualian '+ex.status.toLowerCase())+'</span><span class="small muted">'+esc(ex.alasan)+' · '+esc(ex.catatan)+'</span>';

}

    else{var cur=!nextShown;nextShown=true;h+='<div class="task'+(cur?' cur':'')+'"><span class="mark"></span><span class="grow"><b>'+esc(o.nama)+'</b><span class="small muted">'+esc(o.kerjasama)+' · '+esc(o.channel)+'</span></span><button class="btn sm '+(cur?'btn-green':'btn-soft')+'" data-act="startwiz" data-id="'+oid+'">Cek toko</button></div>'}});

function outletState(o){
  var vs=S.visits.filter(function(v){return v.outlet===o.id}).sort(function(a,b){return (b.date+b.arrive).localeCompare(a.date+a.arrive)});var v=vs[0];
  var tk=S.tickets.filter(function(t){return t.outlet===o.id&&t.status!=='Selesai'}).length;
  if(!v)return {lvl:'warn',v:null,tags:[['warn','Belum pernah dicek']],tk:tk,week:0};
  var lvl=visitLevel(v);var tags=[];var f=flagsOf(v);
  if(f.red.length&&v.review!=='ok')tags.push(['bad',f.red[0]]);
  findings(v).filter(function(x){return x[0]!=='ok'}).forEach(function(x){tags.push(x)});

  var b=baseOf(md),L=function(seq){return seqKm(b,seq.map(function(o){return llOf(outletOf(o))}))};

  starts.forEach(function(st){var rest=has.slice(),seq=[];var cur=b;if(st){seq.push(st);rest.splice(rest.indexOf(st),1);cur=llOf(outletOf(st))}
    while(rest.length){var bi=0,bd=1e9;rest.forEach(function(o,i){var d=hav(cur,llOf(outletOf(o)));if(d<bd){bd=d;bi=i}});cur=llOf(outletOf(rest[bi]));seq.push(rest.splice(bi,1)[0])}
